spring.application.name=agent

# ==========================================
# KẾT NỐI SERVER
# Có thể ghi đè bằng biến môi trường AGENT_SERVER_URL
# ==========================================
agent.server-url=http://localhost:8080
agent.version=1.0.0

# ==========================================
# ĐĂNG KÝ AGENT
# Agent ID và Credential do Server cấp sau khi Admin phê duyệt,
# không cần (và không nên) khai báo ở đây.
# ==========================================

# Thư mục lưu trạng thái đăng ký và Credential.
# Mặc định: <thư mục home của người dùng>/.pbl4-agent
# Có thể ghi đè bằng biến môi trường AGENT_DATA_DIR
#agent.data-dir=

# Chu kỳ hỏi Server xem yêu cầu đăng ký đã được duyệt chưa (giây)
agent.registration.poll-interval-seconds=10