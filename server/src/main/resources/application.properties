spring.application.name=server

# ==========================================
# LOAD ENVIRONMENT FILE
# ==========================================
spring.config.import=optional:file:.env[.properties]

# ==========================================
# DATABASE
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/pbl4_monitor?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=PBL4
spring.datasource.password=cuong2006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# SERVER
# ==========================================
server.port=8080

# ==========================================
# MAIL
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# SECURITY
# ==========================================
logging.level.org.springframework.security=DEBUG

# ==========================================
# JWT
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000