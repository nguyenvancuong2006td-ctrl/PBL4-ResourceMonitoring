<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PBL4 · Trình xem màn hình (thử nghiệm)</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #667085;
    --line: #d9dde3; --accent: #0b6bcb; --ok: #1a7f4b; --bad: #b42318;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #8b95a5;
      --line: #2a3039; --accent: #4c9aff; --ok: #3ccf82; --bad: #ff7b72;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; display: grid; gap: 16px; }
  form { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
         padding: 16px; display: grid; gap: 12px; }
  label { display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
  input, textarea { font: inherit; color: var(--text); background: var(--bg);
         border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  textarea { height: 72px; resize: vertical; font-family: ui-monospace, monospace; font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; padding: 8px 16px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  button.secondary { background: transparent; color: var(--text); border-color: var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); }
  #status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
  .screen { background: #000; border: 1px solid var(--line); border-radius: 8px;
            display: grid; place-items: center; min-height: 240px; overflow: hidden; }
  canvas { max-width: 100%; height: auto; display: block; outline: none; }
  canvas.control { cursor: crosshair; box-shadow: 0 0 0 2px var(--accent); }
  .toggle { display: flex; gap: 6px; align-items: center; color: var(--text); font-size: 14px; }
  #controlHint { color: var(--muted); font-size: 12px; }
  .stats { color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <form id="form">
    <label>Địa chỉ WebSocket
      <input id="url" value="ws://localhost:8080/ws/screen" required>
    </label>
    <label>JWT của Admin (lấy từ phản hồi của /api/auth/login)
      <textarea id="token" required spellcheck="false"></textarea>
    </label>
    <label>Session code (lấy từ phản hồi của POST /api/screen-sharing/sessions)
      <input id="session" required spellcheck="false">
    </label>
    <div class="row">
      <button id="connect" type="submit">Kết nối</button>
      <button id="disconnect" class="secondary" type="button" disabled>Ngắt</button>
      <span id="status">Chưa kết nối.</span>
    </div>
    <div class="row">
      <label class="toggle">
        <input id="controlToggle" type="checkbox" disabled>
        Điều khiển từ xa (chuột + bàn phím)
      </label>
      <span id="controlHint">Chưa sẵn sàng.</span>
    </div>
  </form>

  <div class="screen"><canvas id="canvas" width="16" height="9" tabindex="0"></canvas></div>
  <div class="stats" id="stats">Khung hình: 0 · FPS: 0 · Kích thước: –</div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const canvas = $('canvas'), ctx = canvas.getContext('2d');
  let ws = null, frames = 0, windowFrames = 0, lastBytes = 0;
  let controlReady = false;   // Agent báo điều khiển được
  let controlOn = false;      // Admin bật checkbox

  function setStatus(text, kind) {
    const el = $('status');
    el.textContent = text;
    el.className = kind || '';
  }

  function setConnected(on) {
    $('connect').disabled = on;
    $('disconnect').disabled = !on;
  }

  async function drawFrame(buffer) {
    try {
      const bitmap = await createImageBitmap(new Blob([buffer], { type: 'image/jpeg' }));
      if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
      }
      ctx.drawImage(bitmap, 0, 0);
      bitmap.close();
      frames++; windowFrames++; lastBytes = buffer.byteLength;
    } catch (e) { /* khung hình hỏng: bỏ qua */ }
  }

  setInterval(() => {
    $('stats').textContent =
      `Khung hình: ${frames} · FPS: ${windowFrames} · Kích thước: ` +
      (lastBytes ? (lastBytes / 1024).toFixed(0) + ' KB' : '–');
    windowFrames = 0;
  }, 1000);

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    frames = 0;
    setStatus('Đang kết nối...');
    setConnected(true);

    ws = new WebSocket($('url').value.trim());
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => ws.send(JSON.stringify({
      type: 'AUTH', role: 'VIEWER',
      token: $('token').value.trim(),
      sessionCode: $('session').value.trim()
    }));

    ws.onmessage = ev => {
      if (typeof ev.data !== 'string') { drawFrame(ev.data); return; }
      const msg = JSON.parse(ev.data);
      switch (msg.type) {
        case 'JOINED':
          setStatus(msg.agentConnected
            ? 'Đã vào phiên. Đang chờ khung hình...'
            : 'Đã vào phiên. Đang chờ Agent kết nối...', 'ok'); break;
        case 'AGENT_CONNECTED': setStatus('Agent đã kết nối.', 'ok'); break;
        case 'STATUS':
          if (msg.state === 'CONTROL_READY' || msg.state === 'CONTROL_UNSUPPORTED') {
            setControlAvailable(msg.state === 'CONTROL_READY', msg.message);
          } else {
            setStatus('Agent: ' + (msg.message || msg.state), 'ok');
          }
          break;
        case 'ERROR':  setStatus('Lỗi: ' + msg.message, 'bad'); break;
        case 'ENDED':  setStatus('Phiên kết thúc: ' + msg.message, 'bad'); break;
      }
    };

    ws.onclose = ev => {
      setConnected(false);
      setControlAvailable(false, 'Chưa sẵn sàng.');
      if (!$('status').classList.contains('bad')) {
        setStatus('Đã đóng kết nối (mã ' + ev.code + ').');
      }
    };
    ws.onerror = () => setStatus('Không kết nối được tới Server.', 'bad');
  });

  $('disconnect').addEventListener('click', () => ws && ws.close());

  // =====================================================================
  // ĐIỀU KHIỂN TỪ XA
  // Toạ độ gửi đi là CHUẨN HOÁ 0..1 theo khung hình; Agent tự quy đổi ra
  // điểm ảnh thật nên không phụ thuộc kích thước canvas hay việc thu nhỏ.
  // =====================================================================

  function setControlAvailable(ready, message) {
    controlReady = ready;
    $('controlToggle').disabled = !ready;
    $('controlHint').textContent = message || '';

    if (!ready) {
      $('controlToggle').checked = false;
      applyControlState(false);
    }
  }

  function applyControlState(on) {
    if (controlOn && !on) sendInput({ event: 'RELEASE_ALL' });   // nhả phím kẹt
    controlOn = on;
    canvas.classList.toggle('control', on);
    if (on) canvas.focus();
  }

  $('controlToggle').addEventListener('change', e => applyControlState(e.target.checked));

  function sendInput(payload) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'INPUT', ...payload }));
    }
  }

  function norm(ev) {
    const r = canvas.getBoundingClientRect();
    return {
      x: Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)),
      y: Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height))
    };
  }

  // Chuột di chuyển: tối đa ~60 lần/giây (mỗi khung vẽ gửi một lần)
  let pendingMove = null;
  canvas.addEventListener('mousemove', ev => {
    if (!controlOn) return;
    const first = pendingMove === null;
    pendingMove = norm(ev);
    if (first) requestAnimationFrame(() => {
      if (pendingMove) sendInput({ event: 'MOUSE_MOVE', ...pendingMove });
      pendingMove = null;
    });
  });

  canvas.addEventListener('mousedown', ev => {
    if (!controlOn) return;
    ev.preventDefault();
    canvas.focus();
    sendInput({ event: 'MOUSE_DOWN', button: ev.button, ...norm(ev) });
  });

  // mouseup ở window để không bị kẹt nút khi thả chuột ngoài canvas
  window.addEventListener('mouseup', ev => {
    if (!controlOn) return;
    sendInput({ event: 'MOUSE_UP', button: ev.button, ...norm(ev) });
  });

  canvas.addEventListener('contextmenu', ev => { if (controlOn) ev.preventDefault(); });

  canvas.addEventListener('wheel', ev => {
    if (!controlOn) return;
    ev.preventDefault();
    const notches = Math.sign(ev.deltaY) * Math.max(1, Math.round(Math.abs(ev.deltaY) / 100));
    sendInput({ event: 'MOUSE_WHEEL', delta: notches });
  }, { passive: false });

  canvas.addEventListener('keydown', ev => {
    if (!controlOn) return;
    ev.preventDefault();                       // chặn phím tắt của trình duyệt (nếu được)
    sendInput({ event: 'KEY_DOWN', code: ev.code });
  });

  canvas.addEventListener('keyup', ev => {
    if (!controlOn) return;
    ev.preventDefault();
    sendInput({ event: 'KEY_UP', code: ev.code });
  });

  // Mất focus (chuyển tab, bấm ra ngoài): nhả mọi phím đang giữ ở máy Client
  canvas.addEventListener('blur', () => { if (controlOn) sendInput({ event: 'RELEASE_ALL' }); });
  window.addEventListener('blur', () => { if (controlOn) sendInput({ event: 'RELEASE_ALL' }); });
</script>
</body>
</html>
